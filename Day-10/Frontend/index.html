<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GET & POST REQUEST</title>
</head>
<body>
    <h3>GET REQUEST</h3>
    <form method="get" action="http://localhost:8080/request">
        <input placeholder="enter the name" name="user" type="text" >
        <input placeholder="enter the password" name="password" type="password" >
        <button>submit</button>
    </form>

    <hr>

    <h3>POST REQUEST</h3>
    <form method="post" action="http://localhost:8080/request">
        <input placeholder="enter the name" name="user" type="text" >
        <input placeholder="enter the password" name="password" type="password" >
        <button>submit</button>
    </form>
</body>
</html>
